name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs at midnight UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: pavithran26
          # Emerald contribution levels with a crimson snake; %23 is URL-encoded #.
          outputs: |
            dist/github-snake.svg?color_snake=%23D94D60&color_dots=%23F2F6F3,%23CAEAD5,%2389D8AE,%2329B977,%2317774E
            dist/github-snake-dark.svg?color_snake=%23EF6371&color_dots=%230D1513,%231D382C,%232B694B,%2337AC73,%2367DDA0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
