<text x="876" y="157" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13.5" fill="#D0EBEC">React  /  TypeScript</text>
<text x="718" y="147" font-family="monospace" font-size="19" font-weight="700" fill="#FFE6A8">1</text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" begin="0.55s" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<path d="M669 224L876 178L1083 224L876 270Z" fill="#234D73" stroke="#A6E3E6" stroke-width="2"/>
<path d="M669 224L876 270V285L669 239Z" fill="#123554" stroke="#86C1CD"/>
<path d="M876 270L1083 224V239L876 285Z" fill="#17445D" stroke="#86C1CD"/>
<text x="876" y="216" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">APPLICATION APIs</text>
<text x="876" y="240" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13.5" fill="#D0EBEC">FastAPI  /  ASP.NET Core</text>
<text x="703" y="230" font-family="monospace" font-size="19" font-weight="700" fill="#FFE6A8">2</text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" begin="1.1s" dur="5s" repeatCount="indefinite"/>
