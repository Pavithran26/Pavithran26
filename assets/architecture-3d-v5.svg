<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-labelledby="t d">
<title id="t">The engineering stack as a floating three-dimensional system</title>
<desc id="d">Four isometric architectural slabs representing interface, APIs, intelligence and data, and cloud delivery, linked by a central illuminated flow.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071123"/><stop offset="1" stop-color="#124760"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#39CDE3" stop-opacity=".2"/><stop offset="1" stop-color="#39CDE3" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1180" height="520" rx="20" fill="url(#bg)"/>
<circle cx="889" cy="266" r="260" fill="url(#halo)"/>
<rect width="9" height="520" rx="4" fill="#FFCD6A"/>
<text x="49" y="62" fill="#FFD77F" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">03 / SYSTEMS THINKING</text>
<path d="M50 80H518" stroke="#66BED1" stroke-opacity=".6"/>
<text x="47" y="150" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900">FROM PIXELS</text>
<text x="47" y="209" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900">TO PLATFORMS.</text>
<text x="51" y="262" fill="#B7DDE8" font-family="Arial,Helvetica,sans-serif" font-size="21">Product engineering is connecting</text>
<text x="51" y="293" fill="#B7DDE8" font-family="Arial,Helvetica,sans-serif" font-size="21">the layers, not collecting logos.</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#D7E9F0"><text x="54" y="358">EXPERIENCE  →  API</text><text x="54" y="392">DATA  →  INTELLIGENCE</text><text x="54" y="426">CLOUD  →  DELIVERY</text></g>
<text x="51" y="480" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#FFD77F" letter-spacing="1.7">CROSS-PROJECT CAPABILITY MAP</text>
<ellipse cx="876" cy="454" rx="236" ry="29" fill="#000719" opacity=".53"/>
<path d="M875 140V426" stroke="#F7D480" stroke-width="3" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" values="0;-60" dur="5s" repeatCount="indefinite"/></path>
<g>
<path d="M684 141L876 95L1068 141L876 187Z" fill="#296784" stroke="#A6E3E6" stroke-width="2"/>
