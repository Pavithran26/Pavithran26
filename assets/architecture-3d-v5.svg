<text x="876" y="382" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">CLOUD DELIVERY</text>
<text x="876" y="406" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13.5" fill="#D0EBEC">AWS  /  Vercel  /  Render</text>
<text x="668" y="396" font-family="monospace" font-size="19" font-weight="700" fill="#FFE6A8">4</text>
