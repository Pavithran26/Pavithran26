<text x="876" y="323" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="13.5" fill="#D0EBEC">RAG  /  SQL  /  Firestore</text>
<text x="686.5" y="313" font-family="monospace" font-size="19" font-weight="700" fill="#FFE6A8">3</text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" begin="1.6500000000000001s" dur="5s" repeatCount="indefinite"/>
</g>
