<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="385" viewBox="0 0 1100 385" role="img" aria-labelledby="title desc">
<title id="title">Engineering blueprint: from interface to intelligence</title>
<desc id="desc">Illustrative cross-project capability map: frontend interface, backend APIs, intelligence and data, delivery and cloud.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#15172C"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B594FA"/><stop offset="1" stop-color="#66D6DA"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8F9EE0" stroke-width="1.5"/></marker>
</defs>
<rect width="1100" height="385" rx="18" fill="url(#bg)"/>
<path d="M35 19H1064" stroke="url(#top)" stroke-width="2.5" stroke-linecap="round"/>
<text x="45" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">THE ENGINEERING BLUEPRINT</text>
<text x="45" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#AFBEDA">Connecting product experience, services, intelligence and delivery.</text>
<text x="1055" y="61" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#9E94E8">CAPABILITY MAP</text>
