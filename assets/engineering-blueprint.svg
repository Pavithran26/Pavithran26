 <text x="328" y="202" font-size="19" font-weight="700" fill="#F7F6FF">Application APIs</text>
 <text x="328" y="236" font-size="15" fill="#C1D4EB">Python / FastAPI</text>
 <text x="328" y="263" font-size="15" fill="#C1D4EB">ASP.NET Core</text>
 <text x="328" y="290" font-size="15" fill="#C1D4EB">REST and integrations</text>
 <rect x="575" y="125" width="215" height="188" rx="15" fill="#25213F" stroke="#9B74D8"/>
 <rect x="587" y="137" width="38" height="32" rx="8" fill="#60458E"/>
 <text x="606" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#EEE1FF">03</text>
